<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>横浜 グルメMap</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>横浜 グルメMap</h1>
    <div class="header-actions">
      <!-- 特異点移動・選択グループ -->
      <div class="singularity-selector-group">
        <select id="singularity-select" class="select-singularity">
          <!-- JSで動的に追加されます -->
        </select>
        <button id="move-singularity-btn" class="btn btn-orange">特異点へ移動</button>
        <button id="open-singularity-modal-btn" class="btn btn-blue">特異点管理</button>
      </div>

      <div id="count-indicator" class="indicator">登録数: 0 / 30 件</div>
      <button id="add-store-btn" class="btn btn-success">+ 店舗登録</button>
      <button id="open-share-modal-btn" class="btn">共有・切り替え</button>
      
      <!-- ログイン状態表示 -->
      <div id="auth-section">
        <button id="login-btn" class="btn">ログイン</button>
        <span id="user-email" class="user-email-text" style="display:none;"></span>
        <button id="logout-btn" class="btn btn-danger" style="display:none;">ログアウト</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <!-- 地図領域 -->
    <div id="map"></div>

    <!-- サイドバー (絞り込み機能) -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header" id="sidebar-header">
        <h3>店舗検索・絞り込み</h3>
        <button type="button" id="sidebar-toggle-btn" class="sidebar-toggle-btn">検索・絞り込み</button>
      </div>
      <div class="sidebar-content" id="sidebar-content">
        <div class="filter-group">
          <label for="search-name">店舗名検索</label>
          <input type="text" id="search-name" placeholder="店名を入力...">
        </div>
        <div class="filter-group">
          <label for="filter-genre">ジャンル</label>
          <select id="filter-genre">
            <option value="">すべて</option>
            <option value="和食">和食</option>
            <option value="洋食">洋食</option>
            <option value="中華">中華</option>
            <option value="イタリアン">イタリアン</option>
            <option value="居酒屋">居酒屋</option>
            <option value="カフェ">カフェ</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-budget">予算</label>
          <select id="filter-budget">
            <option value="">すべて</option>
            <option value="1000円以内">1000円以内</option>
            <option value="3000円くらい">3000円くらい</option>
            <option value="5000円くらい">5000円くらい</option>
            <option value="10000円以上">10000円以上</option>
          </select>
        </div>
        <div class="filter-group">
          <label>こだわり条件</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" id="filter-charter"> 貸切</label>
            <label><input type="checkbox" id="filter-course"> コース</label>
            <label><input type="checkbox" id="filter-drink"> 飲み放題</label>
            <label><input type="checkbox" id="filter-eat"> 食べ放題</label>
          </div>
        </div>
      </div>
    </div>

    <!-- 詳細スライドパネル -->
    <div id="detail-panel" class="detail-panel">
      <button id="close-detail-btn" class="close-btn">&times;</button>
      
      <!-- 複数店舗画像表示領域 -->
      <div id="detail-image-container" class="detail-image-box" style="display:none;">
        <div id="detail-image-wrapper" class="detail-image-wrapper"></div>
      </div>

      <h2 id="detail-name">店舗名</h2>
      <div class="detail-item"><strong>ジャンル</strong><span id="detail-genre">-</span></div>
      <div class="detail-item"><strong>予算</strong><span id="detail-budget">-</span></div>
      <div class="detail-item"><strong>特徴</strong><span id="detail-features">-</span></div>
      <div class="detail-item"><strong>連絡先</strong><span id="detail-phone">-</span></div>
      <div class="detail-item"><strong>公式サイト</strong><a id="detail-official" href="#" target="_blank">-</a></div>
      <div class="detail-item"><strong>食べログ</strong><a id="detail-tabelog" href="#" target="_blank">-</a></div>
      <div class="detail-item"><strong>ホットペッパー</strong><a id="detail-hotpepper" href="#" target="_blank">-</a></div>
      <div class="detail-item"><strong>他サイト</strong><a id="detail-other" href="#" target="_blank">-</a></div>
      <div class="detail-item detail-notes-item"><strong>備考</strong><span id="detail-notes">-</span></div>
      
      <div style="margin-top:20px;">
        <button id="delete-store-btn" class="btn btn-danger" style="width:100%; display:none;">この店舗を削除する</button>
      </div>
    </div>
  </div>

  <!-- 特異点（マーキングピン）管理モーダル -->
  <div id="singularity-modal" class="modal-overlay">
    <div class="modal">
      <h2>特異点（マーキングピン）の管理</h2>
      <p class="modal-notice">※新しい特異点を追加するには、地図上をクリックするか、現在地を中心にして保存してください。</p>

      <form id="add-singularity-form">
        <div class="filter-group">
          <label for="singularity-name-input">特異点の名前 (例: 自宅, 会社, 実家)</label>
          <input type="text" id="singularity-name-input" required placeholder="名前を入力...">
        </div>
        <div class="flex-row" style="margin-bottom: 15px;">
          <input type="text" id="singularity-coords-input" readonly placeholder="地図をクリックして座標を選択">
          <button type="button" id="use-map-center-btn" class="btn btn-blue">画面中心を使用</button>
        </div>
        <input type="hidden" id="singularity-lat-input">
        <input type="hidden" id="singularity-lng-input">
        <button type="submit" class="btn btn-success" style="width:100%;">+ 新しい特異点を保存</button>
      </form>

      <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">

      <label style="font-weight:bold; font-size:0.9rem;">登録済み特異点一覧</label>
      <div id="singularity-list" class="fav-list" style="max-height: 180px; margin-top:8px;"></div>

      <div class="modal-actions" style="margin-top:15px;">
        <button type="button" id="close-singularity-modal-btn" class="btn btn-gray">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 店舗登録モーダル -->
  <div id="register-modal" class="modal-overlay">
    <div class="modal">
      <h2>店舗を新規登録</h2>
      <form id="register-form">
        <p class="modal-notice">※地図上をクリックするとその場所の座標が自動セットされます</p>
        <div class="filter-group">
          <label for="reg-name">店名 *</label>
          <input type="text" id="reg-name" required>
        </div>
        <div class="filter-group">
          <label for="reg-image">店舗画像（最大5枚まで）</label>
          <input type="file" id="reg-image" accept="image/*" multiple>
        </div>
        <div class="filter-group">
          <label for="reg-genre">ジャンル *</label>
          <select id="reg-genre" required>
            <option value="">選択してください</option>
            <option value="和食">和食</option>
            <option value="洋食">洋食</option>
            <option value="中華">中華</option>
            <option value="イタリアン">イタリアン</option>
            <option value="居酒屋">居酒屋</option>
            <option value="カフェ">カフェ</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="reg-budget">予算 *</label>
          <select id="reg-budget" required>
            <option value="">選択してください</option>
            <option value="1000円以内">1000円以内</option>
            <option value="3000円くらい">3000円くらい</option>
            <option value="5000円くらい">5000円くらい</option>
            <option value="10000円以上">10000円以上</option>
          </select>
        </div>
        <div class="filter-group">
          <label>設備・サービス</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" id="reg-charter"> 貸し切りあり</label>
            <label><input type="checkbox" id="reg-course"> コースあり</label>
            <label><input type="checkbox" id="reg-drink"> 飲み放題あり</label>
            <label><input type="checkbox" id="reg-eat"> 食べ放題あり</label>
          </div>
        </div>
        <div class="filter-group">
          <label for="reg-phone">連絡先</label>
          <input type="text" id="reg-phone">
        </div>
        <div class="filter-group">
          <label for="reg-official">公式サイト URL</label>
          <input type="url" id="reg-official">
        </div>
        <div class="filter-group">
          <label for="reg-tabelog">食べログ URL</label>
          <input type="url" id="reg-tabelog">
        </div>
        <div class="filter-group">
          <label for="reg-hotpepper">ホットペッパー URL</label>
          <input type="url" id="reg-hotpepper">
        </div>
        <div class="filter-group">
          <label for="reg-other">他サイト URL</label>
          <input type="url" id="reg-other">
        </div>
        <div class="filter-group">
          <label for="reg-notes">備考</label>
          <textarea id="reg-notes" placeholder="メモや補足情報を入力してください..."></textarea>
        </div>
        
        <input type="hidden" id="reg-lat" value="35.4658">
        <input type="hidden" id="reg-lng" value="139.6223">

        <div class="modal-actions">
          <button type="button" id="close-register-modal-btn" class="btn btn-gray">キャンセル</button>
          <button type="submit" id="submit-btn" class="btn btn-success">登録</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 認証モーダル -->
  <div id="auth-modal" class="modal-overlay">
    <div class="modal">
      <h2 id="auth-title">ログイン</h2>
      <form id="auth-form">
        <div class="filter-group">
          <label for="auth-email">メールアドレス</label>
          <input type="email" id="auth-email" required placeholder="example@email.com">
        </div>
        <div class="filter-group">
          <label for="auth-password">パスワード</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="6文字以上">
        </div>
        <div class="auth-modal-footer">
          <a href="#" id="auth-toggle-link">新規登録はこちら</a>
          <div class="modal-actions">
            <button type="button" id="close-auth-modal-btn" class="btn btn-gray">閉じる</button>
            <button type="submit" class="btn btn-success" id="auth-submit-btn">ログイン</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 共有・切り替えモーダル -->
  <div id="share-modal" class="modal-overlay">
    <div class="modal">
      <h2>マップの共有・切り替え</h2>
      
      <div class="filter-group">
        <label for="share-current-id">現在表示中のマップID</label>
        <div class="flex-row">
          <input type="text" id="share-current-id" readonly value="">
          <button type="button" id="copy-map-id-btn" class="btn btn-blue">コピー</button>
        </div>
      </div>

      <div class="flex-row" style="margin-top: 10px;">
        <input type="text" id="fav-title-input" placeholder="お気に入りの名前 (例: たろうのマップ)">
        <button type="button" id="add-favorite-btn" class="btn btn-orange" style="white-space:nowrap;">★ お気に入り追加</button>
      </div>

      <div class="info-box">
        <div style="font-size:0.85rem; margin-bottom: 5px;">
          自分のデフォルトマップID: <strong id="my-default-map-id">-</strong>
        </div>
        <button type="button" id="switch-my-default-btn" class="btn btn-success" style="width:100%;">
          自分のデフォルトマップを表示する
        </button>
      </div>

      <div style="margin-top: 15px;">
        <label style="font-weight:bold; font-size:0.9rem;">★ お気に入りマップ一覧</label>
        <div id="favorite-list" class="fav-list"></div>
      </div>

      <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">

      <div class="filter-group">
        <label for="share-input-id">他人のマップIDを読み込む</label>
        <input type="text" id="share-input-id" placeholder="例: MAP-A3F8B2">
      </div>
      <div class="modal-actions" style="margin-top:15px;">
        <button type="button" id="close-share-modal-btn" class="btn btn-gray">閉じる</button>
        <button type="button" id="import-map-btn" class="btn btn-success">このマップを表示</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
